<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jack — The Chalkboard BY Jelam</title>
    <link rel="stylesheet" href="st.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>

<main class="frame">
    <div class="board" role="application" aria-label="Jack chat">

        <header class="board-header">
            <div class="header-text">
                <h1>Jack</h1>
                <p class="tagline">Chalk it up, I'll work it out.</p>
            </div>
            <button class="eraser-btn" id="eraseBtn" title="Erase board" aria-label="Clear conversation">
                <svg viewBox="0 0 48 24" width="34" height="18" aria-hidden="true">
                    <rect x="2" y="2" width="44" height="20" rx="4" fill="#e8dfce"/>
                    <rect x="2" y="2" width="18" height="20" rx="4" fill="#e8998d"/>
                </svg>
            </button>
        </header>

        <div class="chalk-divider" aria-hidden="true"></div>

        <div class="chat-box" id="chatBox" aria-live="polite">
            <div class="message bot-msg">
                Hi, I'm Jack. Ask me things like <b>"What is 25 × 4?"</b> or <b>"sin 45 + cos 45"</b> and I'll work it out on the board.
            </div>
        </div>

        <div class="typing-indicator" id="typingIndicator" hidden>
            <span></span><span></span><span></span>
        </div>

        <form class="input-area" id="inputForm">
            <button type="button" id="voiceBtn" class="icon-btn" title="Voice input" aria-label="Speak your question">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true">
                    <path d="M12 14a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v5a3 3 0 0 0 3 3z"/>
                    <path d="M19 11a1 1 0 0 0-2 0 5 5 0 0 1-10 0 1 1 0 0 0-2 0 7 7 0 0 0 6 6.92V20H9a1 1 0 0 0 0 2h6a1 1 0 0 0 0-2h-2v-2.08A7 7 0 0 0 19 11z"/>
                </svg>
            </button>
            <input
                type="text"
                id="userInput"
                placeholder="Write a problem on the board…"
                autocomplete="off"
            />
            <button type="submit" class="icon-btn send-btn" title="Send" aria-label="Send message">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true">
                    <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"></path>
                </svg>
            </button>
        </form>

        <div class="chalk-tray" aria-hidden="true">
            <div class="chalk chalk-white"></div>
            <div class="chalk chalk-yellow"></div>
            <div class="chalk chalk-pink"></div>
        </div>
    </div>
</main>

<script src="sc.js"></script>
</body>
</html>
